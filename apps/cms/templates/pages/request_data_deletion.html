<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request Data Deletion - Whysper</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0f0f0f;
      color: #e0e0e0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      padding: 20px 16px;
      line-height: 1.5;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 24px;
      text-align: center;
    }

    .warning {
      background: #78350f;
      border: 1px solid #92400e;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 28px;
      font-size: 0.95rem;
    }

    .warning strong {
      color: #fbbf24;
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .label {
      display: block;
      font-size: 0.95rem;
      color: #a0a0a0;
      margin-bottom: 8px;
      font-weight: 500;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      padding: 14px 16px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 12px;
      color: #e0e0e0;
      font-size: 1rem;
      resize: vertical;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: #bb86fc;
      box-shadow: 0 0 0 3px rgba(187, 134, 252, 0.15);
    }

    textarea::placeholder {
      color: #606060;
    }

    .btn-submit {
      display: block;
      width: 100%;
      padding: 16px;
      margin-top: 24px;
      background: #8b5cf6;
      color: white;
      font-size: 1.05rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-submit:hover {
      background: #7c3aed;
    }

    .btn-submit:active {
      transform: translateY(1px);
    }

    .messages {
      margin-bottom: 20px;
    }

    .message-success {
      background: #14532d;
      border: 1px solid #166534;
      color: #86efac;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <div class="container">

    {% if messages %}
      <div class="messages">
        {% for message in messages %}
          <div class="message-success">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}

    <div class="warning">
      <strong>⚠️ Important:</strong>
      Requesting data deletion will remove your personal data from our systems.<br><br>
      Some information may be retained if required by law.
    </div>

    <form method="post">
      {% csrf_token %}

      <div>
        <label class="label">Reason for request (optional)</label>
        <textarea 
          name="reason" 
          placeholder="Tell us why you are requesting data deletion"
          rows="5"></textarea>
      </div>

      <button type="submit" class="btn-submit">
        Submit Deletion Request
      </button>
    </form>

  </div>

</body>
</html>
